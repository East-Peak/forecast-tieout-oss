name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer run on the same ref makes an older one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The core, the generators and the committed app data. Independent of the frontend checks.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      # generate_app_reports --verify runs the pinned type generator from frontend/node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pip install -r engine/requirements-dev.txt

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: Tests
        run: python -m pytest engine/tests/ -n auto

      - name: Tieout core lint and format
        run: |
          ruff check engine/tieout_core engine/tests/tieout_core engine/scripts/synth_history.py engine/scripts/generate_data_v2.py engine/scripts/generate_app_reports.py
          ruff format --check engine/tieout_core engine/tests/tieout_core engine/scripts/synth_history.py engine/scripts/generate_data_v2.py engine/scripts/generate_app_reports.py

      - name: Data-v2 determinism check
        run: python -m engine.scripts.generate_data_v2 --verify

      - name: App data is current (reports, scenario plan files, schema, TypeScript types)
        run: python -m engine.scripts.generate_app_reports --verify

      - name: Tieout core report for the demo companies, without and with the plan
        run: |
          for c in sprout-labs sapling-industries mighty-oak-holdings; do
            python -m engine.tieout_core report \
              --profile engine/config/profiles/$c --data engine/data-v2/$c \
              --as-of 2026-08-31 --out /tmp/tieout-report/$c
            python -m engine.tieout_core report \
              --profile engine/config/profiles/$c --data engine/data-v2/$c \
              --as-of 2026-08-31 --plan engine/config/profiles/$c/plan.yaml \
              --out /tmp/tieout-report-plan/$c
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Frontend verify (knip dead-code gate, then vitest)
        run: cd frontend && npm run verify

      - name: Frontend build
        run: cd frontend && npm run build

  # Builds the app itself, so it waits for nothing.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Frontend build
        run: cd frontend && npm run build

      - name: Browser smoke
        run: cd frontend && npx playwright test --grep @smoke
