    t: "2025-06-30"
    args: {month: "2025-06"}
    reconstructed: {value_cents: 800000}
    contemporaneous: {value_cents: 800000}
    derivation: "O4 (8000) sits in June once its CloseDate is corrected to 06-02 on 06-20; K=06-30 is after the correction, so both modes agree."

  - id: stage_o2_2025_04_30
    question: "Stage of opportunity 006FX0000000002 at 2025-04-30."
    kind: stage_at
    t: "2025-04-30"
    args: {opportunity: "006FX0000000002"}
    reconstructed: {value: "Negotiation"}
    contemporaneous: {value: "Negotiation"}
    derivation: "R1: the Closed Won transition was observed 05-06, after T, so the stage at T is Negotiation (since 04-15) in both modes, even though its CloseDate says 04-25."

  - id: stage_o7_2025_05_31
    question: "Stage of opportunity 006FX0000000007 at 2025-05-31."
    kind: stage_at
    t: "2025-05-31"
    args: {opportunity: "006FX0000000007"}
    reconstructed: {value: "Negotiation"}
    contemporaneous: {value: "Negotiation"}
    derivation: "Negotiation recorded 05-28, Closed Won recorded 06-05 (after T) with CloseDate 05-25: the operational stage at T is Negotiation in both modes."

  - id: open_o7_2025_05_31
    question: "Is opportunity 006FX0000000007 open at 2025-05-31?"
    kind: open_at
    t: "2025-05-31"
    args: {opportunity: "006FX0000000007"}
    reconstructed: {open: false}
    contemporaneous: {open: true}
    derivation: "R2: stage_at says Negotiation, but as known now the deal closed won with effective CloseDate 05-25 <= T, so it is not open; at K=05-31 the closing was unknown."

  - id: open_o4_2025_05_31
    question: "Is opportunity 006FX0000000004 open at 2025-05-31?"
    kind: open_at
    t: "2025-05-31"
    args: {opportunity: "006FX0000000004"}
    reconstructed: {open: true}
    contemporaneous: {open: false}
    derivation: "R2, R3: closed won 05-20 with CloseDate 05-20 as known at K=05-31; the 06-20 correction moved CloseDate to 06-02 > T, so as known now it was still open at T."

  - id: open_o8_reopened
    question: "Is opportunity 006FX0000000008 open at 2025-05-01?"
    kind: open_at
    t: "2025-05-01"
    args: {opportunity: "006FX0000000008"}
    reconstructed: {open: false}
    contemporaneous: {open: false}
    derivation: "Spell 1 closed lost with CloseDate 04-22; the reopening (Proposal, 05-14) starts spell 2 after T=05-01, so it is closed at 05-01 in both modes."

  - id: open_o8_reopened_2025_05_31
    question: "Is opportunity 006FX0000000008 open at 2025-05-31?"
    kind: open_at
    t: "2025-05-31"
    args: {opportunity: "006FX0000000008"}
    reconstructed: {open: true}
    contemporaneous: {open: true}
    derivation: "The reopening was observed 05-14 <= T: spell 2 is open."

