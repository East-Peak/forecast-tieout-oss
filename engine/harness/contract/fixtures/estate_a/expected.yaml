    contemporaneous: {value_cents: 800000}
    derivation: "O7 closed won on 06-05 with CloseDate 05-25 (12000), and O4's CloseDate was moved from 05-20 to 06-02 on 06-20 (R3): K=now has O7 only, K=05-31 has O4 only."

  - id: bookings_2025_06
