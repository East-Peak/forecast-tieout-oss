    question: "Which opportunities are open at 2025-04-30?"
    kind: open_count
    t: "2025-04-30"
    args: {}
    reconstructed: {count: 3, ids: ["006FX0000000003", "006FX0000000004", "006FX0000000005"]}
    contemporaneous: {count: 4, ids: ["006FX0000000002", "006FX0000000003", "006FX0000000004", "006FX0000000005"]}
    derivation: "Commercial (R2). Reconstructed: O1 closed 03-14, O2 closed (CloseDate 04-25), O8 closed lost 04-22 (reopened only 05-14), O5 still existed (R4), O6 and O7 not yet created: O3, O4, O5 open. Contemporaneous: O2's closing is unknown, so O2, O3, O4, O5."

  - id: open_count_2025_05_31
    question: "Which opportunities are open at 2025-05-31?"
    kind: open_count
    t: "2025-05-31"
    args: {}
    reconstructed: {count: 4, ids: ["006FX0000000004", "006FX0000000005", "006FX0000000006", "006FX0000000008"]}
