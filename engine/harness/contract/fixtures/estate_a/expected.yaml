    derivation: "Same count, different deals. Reconstructed: O4 (CloseDate corrected to 06-02) and O5 (not yet deleted), O6, reopened O8; O7 closed 05-25. Contemporaneous: O4 closed 05-20 but O7's closing is unknown."

  - id: closing_o2
