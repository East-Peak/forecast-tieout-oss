    question: "Status of opportunity 006FX0000000005 at 2025-06-30."
    kind: status_at
    t: "2025-06-30"
    args: {opportunity: "006FX0000000005"}
    reconstructed: {status: deleted, flags: [deletion_time_upper_bound]}
    contemporaneous: {status: deleted, flags: [deletion_time_upper_bound]}
    derivation: "R4: absent from the 06-30T23:00 extract, so deleted from that time (an upper bound on when it really went); K=06-30T23:59:59 is after it. Terminal outcome deleted: censored, not lost."

  - id: owner_o4_2025_05_31
    question: "Owner of opportunity 006FX0000000004 at 2025-05-31."
    kind: owner_at
    t: "2025-05-31"
    args: {opportunity: "006FX0000000004"}
    reconstructed: {value: "005FX0000000002"}
    contemporaneous: {value: "005FX0000000002"}
    derivation: "FieldHistory row 05-05 moved OwnerId from 005FX0000000001 to 005FX0000000002, effective and recorded 05-05, before T and K."

