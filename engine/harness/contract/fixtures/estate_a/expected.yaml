    question: "Stage of opportunity 006FX0000000005 (deleted before the second extract) at 2025-05-31."
    kind: stage_at
    t: "2025-05-31"
    args: {opportunity: "006FX0000000005"}
    reconstructed: {value: "Discovery"}
    contemporaneous: {value: "Discovery"}
    derivation: "R4: a deleted record did exist; deletion takes effect at the 06-30 extract, so at T=05-31 it was Discovery since 04-08 in both modes."

