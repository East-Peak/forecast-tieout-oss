# What a correct evidence engine must return for golden fixture A.
# Hand-written. Every case states its derivation in one line.
#
# Modes (design section 1): reconstructed uses K = the latest extract time ("now");
# contemporaneous uses K = the end of day T. T is a business date.
now: "2025-06-30T23:00:00Z"

semantics:
  R1_history_rows: >
    A history row asserts the fields that changed from the previous row of the same record (the
    first row asserts all). effective_at = recorded_at = the row's CreatedDate. A stage transition
    is always effective at its observed timestamp; there is no backdating. The commercial close
    date (CloseDate) is a separate fact.
  R2_two_questions: >
    stage_at(T) is operational: assertions with effective_at <= T and recorded_at <= K, latest
    effective_at wins, ties go to the later recorded_at. open_at(T) is commercial: the record is
    known by K, its CreatedDate <= T, it is not deleted by T (R4), and it is not closed. A deal is
    closed at T when a selling spell closed as known by K has an effective CloseDate <= T and was
    not reopened by T. A closed-to-open stage move starts a new spell and takes effect at its
    observed time. A deal can have a stage_at that says open while open_at says closed.
  R3_measures_restate: >
    A measure over closed deals (bookings, MQL month counts) reads Amount, CloseDate, StageName and
    MQL_Date__c as the latest value with recorded_at <= K, ignoring effective_at. A correction made
    after close, in either direction, restates the deal in its close month, but only for K at or
    after the correction.
  R4_deletion: >
    A record absent from a later complete snapshot of a listed object gets a "_deleted" assertion
    with effective_at = recorded_at = the extracted_at of the first extract lacking it, flagged
    deletion_time_upper_bound. Before that the record existed: open_at, stage_at and its earlier
    bookings and workload stand for every K. From then on it is not open and its terminal outcome is
    deleted (a censoring outcome, not a loss). Voiding a record since creation is a separate explicit
    correction this build does not model.
  R5_snapshot_only_fields: >
    First extract showing a record: its value has effective_at = the record's CreatedDate and
    recorded_at = that extract's extracted_at (flag assumed_since_creation). A later extract showing
    a different value: effective_at = recorded_at = that extract's extracted_at. With no extract of
    the source system at or before K the field is unavailable (no_extract_at_or_before_known_at).
  R6_record_known_since: >
    A record is known from the earliest recorded_at among its history rows; with none, from the first
    extract showing it. Immutable fields (estate.yaml) are known from then.
  R7_unavailable_reasons: >
    object_not_extracted: every extract of the source system at or before K omits the object.
    no_extract_at_or_before_known_at: the source system has no extract at or before K.
  R8_demand_episodes: >
    Each new non-null value of Sales_Offered_Date__c in LeadHistory recorded by K starts an episode
    (offer_seq 1, 2, ...; offered_on is that value). Disposition__c and Disposition_Reason__c rows
    recorded from that offer row up to, not including, the next offer row are the episode's outcome;
    the latest row decides and a null new value means open. MQL_Date__c is optional; the first episode
    is mql_linked when the lead has an MQL date. A lead rejected in March and offered again in May has
    two episodes. Outbound demand is a lead with no MQL date.

cases:
  - id: bookings_2025_03
    question: "New-business bookings with a close date in March 2025, in cents."
    kind: bookings
    t: "2025-03-31"
    args: {month: "2025-03"}
    reconstructed: {value_cents: 2400000}
    contemporaneous: {value_cents: 2000000}
    derivation: "O1 closed won 03-14; its amount was amended 20000 to 24000 on 05-20 (R3): K=now sees 24000, K=03-31 sees 20000."

  - id: bookings_2025_04
    question: "New-business bookings with a close date in April 2025, in cents."
    kind: bookings
    t: "2025-04-30"
    args: {month: "2025-04"}
    reconstructed: {value_cents: 1500000}
    contemporaneous: {value_cents: 0}
    derivation: "O2 was marked Closed Won on 05-06 with CloseDate 04-25 (R3): only K at or after 05-06 counts its 15000 in April."

  - id: bookings_2025_05
    question: "New-business bookings with a close date in May 2025, in cents."
