    contemporaneous: {close_date: "2025-05-31", observed_closed_recorded_at: null}
    derivation: "The commercial close date and the observed closing transition are kept apart: CloseDate 04-25 was entered with the 05-06T16:00 closing row; before that the field said 05-31 and no closing was observed."

