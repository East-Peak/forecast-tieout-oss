# Capacity inputs for Mighty Oak Holdings (synthetic demo company).
# Read by `python -m engine.tieout_core report`; see engine/tieout_core/capacity_rules.py.
# Entered values are used only where the company's own history cannot supply them,
# and the report labels each one fitted, entered or default.
roles:
  quota_carrying: [ae]          # the only roles that carry capacity
  other: [vp_sales, manager, renewal_manager, sdr, se]  # counted, carry none; any other role is excluded with a reason
ramp:
  # Share of a fully ramped rep's creation, by tenure month 1, 2, ... (1 after the last).
  months: [0.0833, 0.25, 0.4167, 0.5833, 0.75, 0.9167]
attrition:
  monthly_per_ae: 0.012          # departures per AE-month
costs:
  loaded_cost_per_ae_month: 16000              # cash cost of one AE for one month
  program_cost_per_dollar_of_pipeline: 0.05  # cash cost per dollar of program pipeline created
program:
  ramp_months: 3                       # a program reaches its full monthly run-rate after this many months
